[package]
name = "feathercode"
version = "0.0.1"
description = "Editor de código da suíte FeatherWorks, com o Claude Code no painel lateral"
authors = ["FeatherWorks"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/feather-works/feathercode"
publish = false

[dependencies]
feather-ui = { git = "https://github.com/feather-works/feather-ui", tag = "v0.3.0" }
pelicano = { git = "https://github.com/feather-works/pelicano.git", tag = "v0.1.9", features = ["terminal", "highlighter"] }
# Mesma escolha do FeatherSheet: diálogo nativo pelo portal, sem GTK.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
serde_json = "1"
# Pasta de configuração de cada sistema (o launcher usa o mesmo).
dirs = "6"
tokio = { version = "1", features = ["process", "io-util", "macros", "sync", "rt", "rt-multi-thread", "time"] }

[profile.release]
lto = "thin"
strip = true

# O pelicano desenha na CPU: sem otimizar, cada quadro leva centenas de ms (mesmas linhas do pelicano).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
